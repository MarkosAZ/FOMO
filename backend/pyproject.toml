[project]
name = "fomo-smart-money-tracker"
version = "0.1.0"
description = "Evidence-first Solana wallet research; no trading or custody"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34.2,<1",
  "httpx>=0.28.1,<1",
  "sqlalchemy>=2.0.40,<3",
  "pydantic>=2.11.4,<3",
  "psycopg[binary]>=3.2.9,<4",
]

[dependency-groups]
dev = ["pytest>=8.3.5,<9", "ruff>=0.11.10,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
